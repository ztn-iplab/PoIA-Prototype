services:
  poia-bank:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Containerfile
    expose:
      - "8000"
    environment:
      POIA_DATA_DIR: /data
      POIA_SESSION_SECRET: "${POIA_SESSION_SECRET:?Set POIA_SESSION_SECRET to a random secret (e.g. openssl rand -hex 32) in .env before starting}"
      POIA_ADMIN_EMAIL: "${POIA_ADMIN_EMAIL:-admin@poia.demo}"
      POIA_ADMIN_PASSWORD: "${POIA_ADMIN_PASSWORD:-}"
      POIA_ENABLED: "${POIA_ENABLED:-true}"
      POIA_TEST_MODE: "${POIA_TEST_MODE:-false}"
      POIA_EXPERIMENT_MODE: "${POIA_EXPERIMENT_MODE:-false}"
      POIA_DOWNSTREAM_URL: "http://poia-ledger:8010"
      POIA_DOWNSTREAM_SERVICE_ID: "poia-bank"
      POIA_DOWNSTREAM_SECRET: "${POIA_DOWNSTREAM_SECRET:-}"
      POIA_TRACK_A_MANIFEST: "${POIA_TRACK_A_MANIFEST:-}"
      POIA_TRACK_A_SCENARIO_ID: "${POIA_TRACK_A_SCENARIO_ID:-}"
      POIA_TRACK_A_EXPECTED_DECISION: "${POIA_TRACK_A_EXPECTED_DECISION:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      POIA_AUTH_BASE_URLS: "${POIA_AUTH_BASE_URLS:-}"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@poia.demo"
      WEB_RP_ID: "${WEB_RP_ID}"
      WEB_ORIGIN: "${WEB_ORIGIN}"
    volumes:
      - poia_data:/data
      - ./app:/app/app:ro
      - ./experiments/track_a:/experiments/track_a
    depends_on:
      - mailpit
      - poia-ledger

  poia-ledger:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Containerfile
    command: ["uvicorn", "downstream.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      POIA_DOWNSTREAM_DATA_DIR: /ledger-data
      POIA_DOWNSTREAM_SERVICE_ID: "poia-bank"
      POIA_DOWNSTREAM_SECRET: "${POIA_DOWNSTREAM_SECRET:-}"
      POIA_DOWNSTREAM_REQUIRE_POIA: "${POIA_DOWNSTREAM_REQUIRE_POIA:-true}"
    volumes:
      - poia_ledger_data:/ledger-data

  mailpit:
    restart: unless-stopped
    image: docker.io/axllent/mailpit:latest
    ports:
      - "127.0.0.1:${POIA_SMTP_HOST_PORT:-1027}:1025"
      - "127.0.0.1:${POIA_MAILPIT_WEB_PORT:-8027}:8025"

  nginx:
    restart: unless-stopped
    image: docker.io/library/nginx:alpine
    ports:
      - "${POIA_HTTPS_PORT:-443}:443"
      - "${POIA_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/sites-enabled:/etc/nginx/conf.d:ro
      - ./certs:/etc/ssl/certs:ro
      - ./private:/etc/ssl/private:ro
    depends_on:
      - poia-bank

volumes:
  poia_data:
  poia_ledger_data:
