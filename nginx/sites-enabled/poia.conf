map "$request_method:$uri" $auth_rate_key {
    default "";
    ~^POST:/(login|signup|forgot-password|reset-password|api/auth/enroll|api/auth/totp/register|webauthn/(register|assertion)-complete) $binary_remote_addr;
}

limit_req_zone $auth_rate_key zone=poia_auth:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name poia.local;

    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /etc/ssl/certs/poia.local.pem;
    ssl_certificate_key /etc/ssl/private/poia.local-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location / {
        limit_req zone=poia_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://poia-bank:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_flags ~ secure httponly samesite=strict;
    }
}

server {
    listen 80;
    server_name poia.local;
    return 301 https://$host$request_uri;
}
